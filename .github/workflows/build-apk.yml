name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor & Plugins
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation @capacitor/local-notifications

      - name: Initialize Capacitor
        run: |
          npx cap init "EcoApp" "com.ecoapp.environment" --web-dir=dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Inject Android Permissions (GPS & Notifications)
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let content = fs.readFileSync(manifestPath, "utf8");
              const permissions = `
    <!-- 1. Quyền định vị GPS vệ tinh chính xác & độ cao -->
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-feature android:name="android.hardware.location.gps" android:required="false" />

    <!-- 2. Quyền gửi thông báo cảnh báo triều cường & UV (Android 13+) -->
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

    <!-- 3. Quyền mạng và rung cảnh báo -->
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
`;
              if (!content.includes("ACCESS_FINE_LOCATION")) {
                content = content.replace("<application", permissions + "\n    <application");
                fs.writeFileSync(manifestPath, content, "utf8");
                console.log("==> Successfully injected GPS & Notification permissions into AndroidManifest.xml!");
              }
            } else {
              console.error("==> Manifest file not found at " + manifestPath);
            }
          '

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
